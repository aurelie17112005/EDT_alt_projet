services:
  - type: web
    name: edt-backend
    env: node
    plan: free
    region: frankfurt
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production

      - key: JWT_SECRET
        generateValue: true
        
      - key: SESSION_SECRET
        generateValue: true

      - key: CAS_SERVICE_URL
        sync: false

      - key: CAS_URL
        value: https://auth.univ-fcomte.fr/

      - key: FRONTEND_URL
        sync: false

      # Database connection - Render will provide DATABASE_URL automatically
      - key: DATABASE_URL
        fromDatabase:
          name: edt-db
          property: connectionString

databases:
  - name: edt-db
    plan: free
    region: frankfurt
    databaseName: emargement
    user: postgres
